<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Plan</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
    color: #e8e8f0;
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  
  .container {
    text-align: center;
    padding: 40px 20px;
    max-width: 600px;
    animation: fadeIn 0.8s ease-in;
  }
  
  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(-20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  
  .emoji {
    font-size: 80px;
    margin-bottom: 20px;
    animation: float 3s ease-in-out infinite;
  }
  
  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }
  
  h1 {
    font-size: 48px;
    margin-bottom: 10px;
    letter-spacing: 2px;
  }
  
  .subtitle {
    font-size: 16px;
    color: #7070a0;
    margin-bottom: 30px;
    letter-spacing: 1px;
  }
  
  .description {
    font-size: 16px;
    color: #a8a8c8;
    margin-bottom: 40px;
    line-height: 1.6;
  }
  
  .cta-button {
    display: inline-block;
    background: linear-gradient(135deg, #f5a623 0%, #facc15 100%);
    color: #000;
    padding: 16px 40px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    box-shadow: 0 8px 24px rgba(245, 166, 35, 0.3);
    border: 2px solid transparent;
  }
  
  .cta-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(245, 166, 35, 0.4);
  }
  
  .cta-button:active {
    transform: translateY(0px);
  }
  
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 20px;
    margin-top: 50px;
    padding-top: 40px;
    border-top: 1px solid rgba(112, 112, 160, 0.3);
  }
  
  .stat {
    padding: 20px;
    background: rgba(19, 19, 26, 0.8);
    border: 1px solid rgba(42, 42, 58, 0.6);
    border-radius: 12px;
    backdrop-filter: blur(10px);
  }
  
  .stat-value {
    font-size: 32px;
    font-weight: 700;
    color: #f5a623;
    margin-bottom: 8px;
  }
  
  .stat-label {
    font-size: 12px;
    color: #7070a0;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="emoji">🚴</div>
    <h1>POWER PLAN</h1>
    <div class="subtitle">Personalised Training Plan</div>
    
    <div class="description">
      A structured 13-week program to build cycling fitness, increase FTP, and achieve peak performance through periodized training phases.
    </div>
    
    <a href="training_plan-10.html" class="cta-button">Start Training →</a>
    
    <div class="stats">
      <div class="stat">
        <div class="stat-value">222W</div>
        <div class="stat-label">Current FTP</div>
      </div>
      <div class="stat">
        <div class="stat-value">245W</div>
        <div class="stat-label">Target FTP</div>
      </div>
      <div class="stat">
        <div class="stat-value">13</div>
        <div class="stat-label">Weeks</div>
      </div>
      <div class="stat">
        <div class="stat-value">4</div>
        <div class="stat-label">Phases</div>
      </div>
    </div>
  </div>
</body>
</html>
